# Local backend stack for DelhiveryWay.
#
# For local dev (see DEV_SETUP.md), only start the infra services and run the
# backend natively for proper hot-reload / debugging:
#
#   docker compose up -d mongo mongo-express mailhog
#   npm run dev
#
# The `backend` service below (docker compose up, no service name) runs the
# whole app in a container too — useful if you don't want Node installed at
# all, but don't run it at the same time as `npm run dev`, both bind port 5000.
#
#   docker compose down          → stop everything
#
# Nothing here is production — it is a throwaway local stack.

name: delhiveryway

services:
  backend:
    build:
      context: .
      target: dev
    container_name: delhiveryway_backend
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      # Inside the Docker network, reach siblings by service name — not localhost.
      MONGO_URI: mongodb://mongo:27017/delhiveryway_dev
      SMTP_HOST: mailhog
      SMTP_PORT: '1025'
    volumes:
      - .:/app
      # Keep the container's node_modules (don't let the host folder shadow it).
      - backend_node_modules:/app/node_modules
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: delhiveryway_mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # Browse the local database in a browser at http://localhost:8081 (admin / admin)
  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: delhiveryway_mongo_express
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: 'true'
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongo
    restart: unless-stopped

  # Catches every email the backend sends in dev — view at http://localhost:8025
  mailhog:
    image: mailhog/mailhog
    container_name: delhiveryway_mailhog
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    restart: unless-stopped

volumes:
  mongo_data:
  backend_node_modules:
